host: localhost:8003
info:
  contact:
    email: suporte@screek.com
    name: Suporte screeK
    url: http://www.screek.com/support
  description: API para a plataforma de cinema screeK.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: screeK API
  version: "1.0"
paths:
  /admin/analytics/genres:
    get:
      description: Analisa a distribuição de vendas por gênero de filme
      parameters:
      - description: Data inicial
        in: query
        name: start
        type: string
      - description: Data final
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.GenreStatsResponseDTO'
            type: array
      security:
      - BearerAuth: []
      summary: Preferência por gênero
      tags:
      - Analytics
  /admin/analytics/movies:
    get:
      description: Retorna ranking de filmes por bilheteria e ingressos vendidos
      parameters:
      - description: Data inicial
        in: query
        name: start
        type: string
      - description: Data final
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.MovieStatsDTO'
            type: array
      security:
      - BearerAuth: []
      summary: Desempenho por filme
      tags:
      - Analytics
  /admin/analytics/revenue:
    get:
      description: Retorna métricas financeiras (total, média, tendências)
      parameters:
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: start
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: end
        type: string
      - description: Periodicidade (daily, monthly)
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AnalyticsSummaryResponseDTO'
      security:
      - BearerAuth: []
      summary: Estatísticas de receita
      tags:
      - Analytics
  /admin/management/cinemas:
    get:
      description: Retorna todos os cinemas cadastrados (Apenas Admin/Manager)
      produces:
