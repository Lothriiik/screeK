services:
  db:
    image: postgres:15-alpine
    container_name: screek-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=screek
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - screek-network

  redis:
    image: redis:7-alpine
    container_name: screek-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - screek-network

  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: screek-meilisearch
    restart: always
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=masterKey123
    volumes:
      - meili_data:/meili_data
    networks:
      - screek-network

networks:
  screek-network:
    driver: bridge

volumes:
  postgres_data:
  meili_data: